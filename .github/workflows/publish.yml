# Standalone manual fallback for publishing tagged releases to npm.
# The primary publish step lives in bump-version.yml, which bumps, commits,
# tags, pushes, and publishes in a single workflow run. Use this workflow only
# when you need to re-publish or publish a tag created outside the Release
# workflow.
#
# Triggers:
#   - workflow_dispatch (manual fallback)
#
# Note: a `push: tags: ['v*']` trigger used to live here as a legacy safety
# net, but it produced a deterministic npm 409 "You cannot publish over the
# previously published version" because bump-version.yml pushes the tag and
# then publishes the same version in the same job. The shared concurrency
# group only serializes the duplicate run; it does not prevent it. Tag pushes
# are now exclusively handled by bump-version.yml.

name: Publish

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# share concurrency with bump-version.yml's publish step so simultaneous
# manual dispatches don't race on `npm publish` and produce a 409
# "You cannot publish over the previously published version".
concurrency:
  group: release-bump-version
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Match the bump-version release job timeout so a hung publish doesn't
    # park the queue past the bump-version cap.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Print toolchain
        run: node -v && npm -v

      - run: npm ci

      - name: Determine dist-tag
        id: dist_tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if echo "$VERSION" | grep -q "alpha"; then
            echo "tag=alpha" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Verify npm token
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Token publish (no --provenance flag). Provenance + token together can 404 if
      # trusted publishing is enabled on npmjs.com. Use trusted publishing instead
      # (remove NODE_AUTH_TOKEN from this step) once configured — see npm docs.
      - name: Publish to npm
        run: npm publish --access public --tag ${{ steps.dist_tag.outputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
